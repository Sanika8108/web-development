<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 50%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Holiday List</h2>

    <table>
        <tr>
            <th>Holiday</th>
            <th>Date</th>
        </tr>
        <tr>
            <td>Diwali</td>
            <td>11 November</td>
        </tr>
        <tr>
            <td>Christmas</td>
            <td>25 December</td>
        </tr>
        <tr>
            <td>Holi</td>
            <td>25 March</td>
        </tr>
    </table>

</body>
</html>
